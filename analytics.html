<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics · Sports Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .analytics-section { padding:40px 0; background:#f8fafc; }
        .analytics-section .container { max-width:1100px; margin:auto; }
        .analytics-card { background:#fff; border-radius:24px; padding:24px; margin-bottom:32px; border:1px solid #e9edf2; }
        .analytics-card h3 { font-size:1.2rem; font-weight:700; margin-bottom:16px; }
        .period-selector { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
        .period-btn { padding:8px 20px; border-radius:40px; border:1px solid #e2e8f0; background:#fff; cursor:pointer; font-weight:500; }
        .period-btn.active { background:#f97316; color:#fff; border-color:#f97316; }
        .stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:16px; margin-bottom:20px; }
        .stat-box { background:#f8fafc; padding:16px; border-radius:12px; text-align:center; }
        .stat-box .number { font-size:2rem; font-weight:700; color:#0b1a2e; }
        .stat-box .label { color:#64748b; font-size:0.9rem; }
        .chart-container { height:300px; margin-top:16px; }
        .country-list { list-style:none; padding:0; }
        .country-list li { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f1f5f9; }
        .country-list .country { font-weight:500; }
        .country-list .count { color:#64748b; }
        @media (max-width:640px) { .stat-grid { grid-template-columns:1fr 1fr; } }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand"><i class="fas fa-trophy brand-icon"></i><span>Sports<span class="brand-highlight">Arena</span></span></a>
            <nav class="nav-links">
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="dashboard.html"><i class="fas fa-user-cog"></i> Dashboard</a></li>
                    <li><a href="#" id="logoutBtn" class="btn-outline-nav"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
            <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        </div>
    </header>

    <section class="analytics-section">
        <div class="container">
            <h1 style="font-size:2.2rem; margin-bottom:8px;">📊 Analytics</h1>
            <p style="color:#64748b; margin-bottom:24px;">View your blog's performance – daily, weekly, monthly.</p>

            <!-- Period Selector -->
            <div class="period-selector">
                <button class="period-btn active" data-period="daily">Daily</button>
                <button class="period-btn" data-period="weekly">Weekly</button>
                <button class="period-btn" data-period="monthly">Monthly</button>
            </div>

            <!-- Summary Stats -->
            <div class="stat-grid" id="summaryStats">
                <div class="stat-box"><div class="number" id="totalViews">0</div><div class="label">Total Views</div></div>
                <div class="stat-box"><div class="number" id="uniqueArticles">0</div><div class="label">Articles Viewed</div></div>
                <div class="stat-box"><div class="number" id="topCountry">-</div><div class="label">Top Country</div></div>
            </div>

            <!-- Country Breakdown -->
            <div class="analytics-card">
                <h3><i class="fas fa-globe-americas"></i> Top Countries</h3>
                <ul class="country-list" id="countryList"><li>Loading...</li></ul>
            </div>

            <!-- Article Views Chart -->
            <div class="analytics-card">
                <h3><i class="fas fa-chart-bar"></i> Article Views (Top 10)</h3>
                <div class="chart-container"><canvas id="articleChart"></canvas></div>
            </div>

            <!-- Country Chart -->
            <div class="analytics-card">
                <h3><i class="fas fa-map"></i> Country Breakdown</h3>
                <div class="chart-container"><canvas id="countryChart"></canvas></div>
            </div>
        </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Ensure only admin can view
        if (!isAdmin()) {
            window.location.href = 'login.html';
        }

        let currentPeriod = 'daily';
        let articleChartInstance = null;
        let countryChartInstance = null;

        document.querySelectorAll('.period-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentPeriod = this.dataset.period;
                fetchStats(currentPeriod);
            });
        });

        async function fetchStats(period) {
            try {
                const views = await getViewStats(period);
                const countryStats = await getCountryStats(period);
                const articleStats = await getArticleStats(period);

                // Update summary
                document.getElementById('totalViews').textContent = views.length;
                document.getElementById('uniqueArticles').textContent = Object.keys(articleStats).length;
                const topCountry = countryStats.length > 0 ? countryStats[0][0] : '-';
                document.getElementById('topCountry').textContent = topCountry;

                // Update country list
                const list = document.getElementById('countryList');
                if (countryStats.length === 0) {
                    list.innerHTML = '<li>No data for this period.</li>';
                } else {
                    list.innerHTML = countryStats.map(([country, count]) => 
                        `<li><span class="country">${country}</span><span class="count">${count} views</span></li>`
                    ).join('');
                }

                // Article chart
                const articles = await getArticles();
                const articleMap = {};
                articles.forEach(a => { articleMap[a.slug] = a.title; });
                const sortedArticleStats = Object.entries(articleStats)
                    .sort((a,b) => b[1] - a[1])
                    .slice(0, 10);
                const labels = sortedArticleStats.map(([slug]) => articleMap[slug] || slug);
                const data = sortedArticleStats.map(([,count]) => count);

                const ctx = document.getElementById('articleChart').getContext('2d');
                if (articleChartInstance) articleChartInstance.destroy();
                articleChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Views',
                            data: data,
                            backgroundColor: '#f97316',
                            borderRadius: 4,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });

                // Country chart
                const countryLabels = countryStats.slice(0, 10).map(([c]) => c);
                const countryData = countryStats.slice(0, 10).map(([,c]) => c);
                const ctx2 = document.getElementById('countryChart').getContext('2d');
                if (countryChartInstance) countryChartInstance.destroy();
                countryChartInstance = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: countryLabels,
                        datasets: [{
                            data: countryData,
                            backgroundColor: ['#f97316','#3b82f6','#22c55e','#eab308','#8b5cf6','#ec4899','#14b8a6','#f43f5e','#f59e0b','#6366f1'],
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'right' } }
                    }
                });

            } catch(err) {
                console.error(err);
                alert('Error loading analytics: ' + err.message);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            adminLogout();
        });

        // Hamburger
        document.getElementById('hamburger').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('open');
        });

        // Load initial stats
        document.addEventListener('DOMContentLoaded', function() {
            fetchStats('daily');
        });
    </script>
</body>
</html>
