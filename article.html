<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Arena · Article</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/article.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- SEO tags (same as before) -->
    <title id="dynamicTitle">Sports Arena · Article</title>
    <meta name="description" id="dynamicDescription" content="Read the latest sports news and analysis on Sports Arena.">
    <meta name="keywords" content="sports, news, analysis, football, basketball, cricket">
    <link rel="canonical" id="dynamicCanonical" href="">
    <meta property="og:title" id="ogTitle" content="Sports Arena">
    <meta property="og:description" id="ogDescription" content="Read the latest sports news and analysis on Sports Arena.">
    <meta property="og:url" id="ogUrl" content="">
    <meta property="og:type" content="article">
    <meta property="og:image" id="ogImage" content="https://picsum.photos/seed/sports/1200/630">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitterTitle" content="Sports Arena">
    <meta name="twitter:description" id="twitterDescription" content="Read the latest sports news and analysis on Sports Arena.">
    <meta name="twitter:image" id="twitterImage" content="https://picsum.photos/seed/sports/1200/630">
    <style>
        /* ... your existing styles (unchanged) ... */
        /* Make sure caption styles are present */
        .article-content figure {
            margin: 24px 0;
            text-align: center;
        }
        .article-content figure img {
            max-width: 100%;
            border-radius: 12px;
        }
        .article-content figure figcaption {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 8px;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- same navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand"><i class="fas fa-trophy brand-icon"></i><span>Sports<span class="brand-highlight">Arena</span></span></a>
            <nav class="nav-links">
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li id="authNav"><a href="login.html" class="btn-primary-nav"><i class="fas fa-lock"></i> Admin Login</a></li>
                    <li id="adminNav" style="display:none;">
                        <a href="dashboard.html" class="btn-primary-nav"><i class="fas fa-user-cog"></i> Dashboard</a>
                        <a href="analytics.html" class="btn-primary-nav"><i class="fas fa-chart-line"></i> Analytics</a>
                        <a href="#" id="logoutBtn" class="btn-outline-nav"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </nav>
            <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        </div>
    </header>

    <section class="single-article">
        <div class="container" id="articleContainer">
            <div class="loader" id="loadingSpinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading article...</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <!-- same footer -->
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            const container = document.getElementById('articleContainer');
            const spinner = document.getElementById('loadingSpinner');

            if (!slug) {
                if (spinner) spinner.remove();
                container.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Article not found</h2>
                        <p>No article specified.</p>
                        <a href="index.html" class="btn-primary" style="text-decoration:none; display:inline-block; margin-top:16px;">← Back to Home</a>
                    </div>
                `;
                return;
            }

            try {
                const articles = await getArticles();
                const article = articles.find(a => a.slug === slug);

                if (!article) {
                    if (spinner) spinner.remove();
                    container.innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h2>Article not found</h2>
                            <p>The article you're looking for doesn't exist or has been removed.</p>
                            <a href="index.html" class="btn-primary" style="text-decoration:none; display:inline-block; margin-top:16px;">← Back to Home</a>
                        </div>
                    `;
                    return;
                }

                // Update SEO
                function updateMetaTagsSafely() {
                    const desc = article.summary || article.content?.slice(0, 160) || 'Read the latest sports news on Sports Arena.';
                    const image = article.image || 'https://picsum.photos/seed/sports/1200/630';
                    const title = article.title + ' · Sports Arena';
                    const url = window.location.href;

                    document.title = title;

                    const setMeta = (selector, content) => {
                        const el = document.querySelector(selector);
                        if (el) el.content = content;
                    };
                    const setLink = (selector, href) => {
                        const el = document.querySelector(selector);
                        if (el) el.href = href;
                    };

                    setMeta('meta[name="description"]', desc);
                    setMeta('meta[name="keywords"]', (article.tags || []).join(', ') || 'sports, news, analysis');
                    setLink('link[rel="canonical"]', url);
                    setMeta('meta[property="og:title"]', title);
                    setMeta('meta[property="og:description"]', desc);
                    setMeta('meta[property="og:image"]', image);
                    setMeta('meta[property="og:url"]', url);
                    setMeta('meta[name="twitter:title"]', title);
                    setMeta('meta[name="twitter:description"]', desc);
                    setMeta('meta[name="twitter:image"]', image);
                }
                updateMetaTagsSafely();

                // Render
                const viewCount = article.views || 0;
                const comments = await getComments(slug);
                const url = window.location.href;
                const title = encodeURIComponent(article.title);
                const shareUrl = encodeURIComponent(url);

                const tagsHtml = (article.tags && article.tags.length) ?
                    `<div class="article-tags">${article.tags.map(t => `<span>#${t}</span>`).join('')}</div>` : '';

                let commentsHtml = `<div class="comments-section">
                    <h3><i class="fas fa-comments"></i> Comments</h3>
                    <div class="comments-count">${comments.length} comment${comments.length!==1?'s':''}</div>
                    <div class="comment-list">`;
                if (comments.length === 0) {
                    commentsHtml += `<div class="no-comments">No comments yet. Be the first!</div>`;
                } else {
                    comments.forEach(c => {
                        const date = c.createdAt ? new Date(c.createdAt.toDate()).toLocaleDateString() : '';
                        commentsHtml += `
                            <div class="comment-item">
                                <div class="comment-header"><span class="comment-name">${c.name}</span><span class="comment-date">${date}</span></div>
                                <p class="comment-text">${c.comment}</p>
                            </div>
                        `;
                    });
                }
                commentsHtml += `</div>
                    <form class="comment-form" id="commentForm">
                        <div class="form-row">
                            <input type="text" id="commentName" placeholder="Your name *" required>
                            <input type="email" id="commentEmail" placeholder="Email (optional)">
                        </div>
                        <textarea id="commentText" placeholder="Your comment..." required></textarea>
                        <button type="submit" class="btn-submit" id="commentSubmit">Post Comment</button>
                        <div class="comment-message" id="commentMessage"></div>
                    </form>
                </div>`;

                // 🔥 Featured image with lazy loading and fallback
                const featuredImg = article.image ? `<img src="${article.image}" alt="${article.title}" class="article-image" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/seed/sports/1200/630';">` : '';

                const html = `
                    <span class="article-category-badge">${article.category}</span>
                    <h1>${article.title}</h1>
                    <div class="article-meta">
                        <span><i class="fas fa-user-edit"></i> ${article.author}</span>
                        <span><i class="far fa-calendar-alt"></i> ${article.date}</span>
                        <span><i class="fas fa-eye"></i> ${viewCount}</span>
                    </div>
                    ${featuredImg}
                    ${tagsHtml}
                    <div class="article-content">${article.content}</div>
                    <div class="share-section">
                        <span style="font-weight:600; color:#1e293b;"><i class="fas fa-share-alt"></i> Share:</span>
                        <div class="share-buttons">
                            <a href="https://twitter.com/intent/tweet?text=${title}&url=${shareUrl}" target="_blank" class="twitter"><i class="fab fa-twitter"></i></a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="facebook"><i class="fab fa-facebook-f"></i></a>
                            <a href="https://api.whatsapp.com/send?text=${title}%20${shareUrl}" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
                            <button onclick="copyLink('${shareUrl}')" class="copy"><i class="fas fa-link"></i></button>
                        </div>
                    </div>
                    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to all articles</a>
                    ${commentsHtml}
                `;

                if (spinner) spinner.remove();
                container.innerHTML = html;

                // 🔥 Apply lazy loading to all images inside the article content
                document.querySelectorAll('.article-content img').forEach(img => {
                    img.setAttribute('loading', 'lazy');
                    img.setAttribute('onerror', "this.onerror=null; this.src='https://picsum.photos/seed/sports/800/400';");
                });

                // Comment form
                const form = document.getElementById('commentForm');
                if (form) {
                    form.addEventListener('submit', async function(e) {
                        e.preventDefault();
                        const name = document.getElementById('commentName').value.trim();
                        const email = document.getElementById('commentEmail').value.trim();
                        const comment = document.getElementById('commentText').value.trim();
                        const msgDiv = document.getElementById('commentMessage');
                        const submitBtn = document.getElementById('commentSubmit');
                        if (!name || !comment) {
                            msgDiv.innerHTML = '<span style="color:#dc2626;">Please fill in name and comment.</span>';
                            return;
                        }
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Posting...';
                        const result = await addComment(slug, name, comment, email);
                        if (result.success) {
                            msgDiv.innerHTML = '<span style="color:#16a34a;">✅ Comment posted!</span>';
                            const fresh = await getComments(slug);
                            const list = document.querySelector('.comment-list');
                            const countDiv = document.querySelector('.comments-count');
                            if (list) {
                                if (fresh.length === 0) list.innerHTML = '<div class="no-comments">No comments yet.</div>';
                                else {
                                    list.innerHTML = fresh.map(c => {
                                        const date = c.createdAt ? new Date(c.createdAt.toDate()).toLocaleDateString() : '';
                                        return `<div class="comment-item"><div class="comment-header"><span class="comment-name">${c.name}</span><span class="comment-date">${date}</span></div><p class="comment-text">${c.comment}</p></div>`;
                                    }).join('');
                                }
                                if (countDiv) countDiv.textContent = `${fresh.length} comment${fresh.length!==1?'s':''}`;
                            }
                            document.getElementById('commentName').value = '';
                            document.getElementById('commentEmail').value = '';
                            document.getElementById('commentText').value = '';
                            setTimeout(() => msgDiv.innerHTML = '', 3000);
                        } else {
                            msgDiv.innerHTML = `<span style="color:#dc2626;">❌ Failed: ${result.error}</span>`;
                        }
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Post Comment';
                    });
                }

                // Log view
                fetch('https://ipapi.co/json/')
                    .then(res => res.json())
                    .then(data => {
                        incrementViewsAndLog(article.id, slug, data.country_name || 'Unknown');
                    })
                    .catch(() => {
                        incrementViewsAndLog(article.id, slug, 'Unknown');
                    });

            } catch (error) {
                console.error('Article loading error:', error);
                if (spinner) spinner.remove();
                container.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>Error loading article</h2>
                        <p>${error.message}</p>
                        <a href="index.html" class="btn-primary" style="text-decoration:none; display:inline-block; margin-top:16px;">← Back to Home</a>
                    </div>
                `;
            }
        })();

        window.copyLink = function(url) {
            const realUrl = decodeURIComponent(url);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(realUrl).then(() => alert('✅ Link copied!')).catch(() => fallbackCopy(realUrl));
            } else {
                fallbackCopy(realUrl);
            }
        };
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); alert('✅ Link copied!'); } catch(e) { alert('❌ Failed to copy.'); }
            document.body.removeChild(ta);
        }

        document.getElementById('hamburger').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('open');
        });
    </script>
</body>
    </html>
