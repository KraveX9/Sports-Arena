    <style>
        .wp-editor-wrapper { display: flex; gap: 32px; max-width: 1200px; margin: 0 auto; padding: 24px; }
        .wp-editor-main { flex: 2; min-width: 0; }
        .wp-editor-sidebar { flex: 1; min-width: 220px; }
        .wp-editor-sidebar .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .wp-editor-sidebar .card h4 { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 12px; }
        .wp-editor-sidebar input[type="text"], .wp-editor-sidebar select { width: 100%; padding: 8px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; margin-bottom: 8px; }
        .wp-editor-sidebar textarea { width: 100%; padding: 8px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; resize: vertical; min-height: 80px; font-family: inherit; }
        .wp-editor-sidebar .btn-primary { width: 100%; justify-content: center; padding: 12px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; background: #f97316; color: #fff; }
        .wp-editor-sidebar .btn-primary:hover { background: #ea580c; }
        .wp-editor-sidebar .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .wp-editor-sidebar .preview-img { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid #e2e8f0; }
        .wp-editor-sidebar .remove-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.8rem; margin-top: 4px; }
        .wp-editor-sidebar .file-input { padding: 8px; border: 1.5px dashed #e2e8f0; border-radius: 8px; width: 100%; font-size: 0.85rem; }
        .wp-editor-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-bottom: none; border-radius: 12px 12px 0 0; }
        .wp-editor-toolbar button { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; color: #1e293b; font-weight: 500; }
        .wp-editor-toolbar button:hover { background: #f1f5f9; border-color: #94a3b8; }
        .wp-editor-toolbar button i { margin-right: 4px; }
        .wp-editor-toolbar .format-btn { background: #f97316; color: #fff; border-color: #f97316; }
        .wp-editor-toolbar .format-btn:hover { background: #ea580c; border-color: #ea580c; }
        .wp-editor-toolbar .image-btn { background: #e0f2fe; border-color: #7dd3fc; }
        .wp-editor-toolbar .image-btn:hover { background: #bae6fd; }
        .wp-editor-toolbar .caption-btn { background: #fef3c7; border-color: #f59e0b; }
        .wp-editor-toolbar .caption-btn:hover { background: #fde68a; }
        .wp-editor-content { border: 1.5px solid #e2e8f0; border-radius: 0 0 12px 12px; background: #fff; min-height: 400px; padding: 16px; font-family: 'Inter', sans-serif; }
        .wp-editor-content:focus { outline: none; border-color: #f97316; }
        .wp-editor-content h2 { font-size: 1.8rem; font-weight: 700; margin: 16px 0 8px; }
        .wp-editor-content h3 { font-size: 1.4rem; font-weight: 700; margin: 14px 0 6px; }
        .wp-editor-content h4 { font-size: 1.2rem; font-weight: 700; margin: 12px 0 4px; }
        .wp-editor-content figure { margin: 20px 0; text-align: center; }
        .wp-editor-content figure img { max-width: 100%; border-radius: 12px; }
        .wp-editor-content figure figcaption { font-size: 0.9rem; color: #64748b; margin-top: 8px; font-style: italic; }
        .wp-editor-title { font-size: 2rem; font-weight: 700; border: none; border-bottom: 2px solid transparent; padding: 8px 0; width: 100%; margin-bottom: 16px; background: transparent; color: #0b1a2e; }
        .wp-editor-title:focus { outline: none; border-bottom-color: #f97316; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; margin-top: 8px; }
        .status-badge.draft { background: #f1f5f9; color: #475569; }
        .status-badge.published { background: #dcfce7; color: #16a34a; }
        .wp-notice { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; }
        .wp-notice.success { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
        .wp-notice.error { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .wp-notice.info { background: #dbeafe; color: #2563eb; border: 1px solid #93c5fd; }
        @media (max-width: 768px) { .wp-editor-wrapper { flex-direction: column; padding: 12px; } .wp-editor-sidebar { flex: 1; } .wp-editor-title { font-size: 1.5rem; } }
    </style>

                    <button id="h2Btn">H2</button>

                    <button id="h4Btn">H4</button>
                    <span style="color:#94a3b8;">|</span>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // ============================================================
        //  EDITOR LOGIC – WITH IMAGE COMPRESSION
        // ============================================================

        let editingId = null;
        let currentFeaturedFile = null;
        let pendingCaption = false;

        // DOM refs
        const content = document.getElementById('editorContent');
        const title = document.getElementById('articleTitle');
        const category = document.getElementById('articleCategory');
        const tags = document.getElementById('articleTags');
        const excerpt = document.getElementById('articleExcerpt');
        const date = document.getElementById('articleDate');
        const featuredInput = document.getElementById('featuredImageInput');
        const featuredPreview = document.getElementById('featuredPreview');
        const featuredPreviewContainer = document.getElementById('featuredPreviewContainer');
        const featuredUrl = document.getElementById('featuredImageUrl');
        const removeFeaturedBtn = document.getElementById('removeFeaturedBtn');
        const publishBtn = document.getElementById('publishBtn');
        const updateBtn = document.getElementById('updateBtn');
        const cancelBtn = document.getElementById('cancelEditBtn');
        const statusBadge = document.getElementById('statusBadge');
        const publishMsg = document.getElementById('publishMessage');
        const notice = document.getElementById('editorNotice');

        // ---------- COMPRESSED UPLOAD FUNCTION ----------
        async function uploadCompressedImage(file) {
            if (!file) return null;
            try {
                // Compress image
                const options = {
                    maxSizeMB: 0.2,
                    maxWidthOrHeight: 1200,
                    useWebWorker: true,
                    fileType: 'image/jpeg',
                    initialQuality: 0.8
                };
                const compressed = await imageCompression(file, options);
                // Upload to ImgBB
                const reader = new FileReader();
                return new Promise((resolve, reject) => {
                    reader.readAsDataURL(compressed);
                    reader.onload = async () => {
                        try {
                            const base64 = reader.result.split(',')[1];
                            const formData = new FormData();
                            formData.append('key', IMGBB_API_KEY);
                            formData.append('image', base64);
                            const response = await fetch('https://api.imgbb.com/1/upload', {
                                method: 'POST',
                                body: formData
                            });
                            const data = await response.json();
                            if (data.success) resolve(data.data.url);
                            else reject(new Error(data.error?.message || 'ImgBB upload failed'));
                        } catch (e) { reject(e); }
                    };
                    reader.onerror = () => reject(new Error('Failed to read file'));
                });
            } catch (error) {
                console.error('Compression error:', error);
                // Fallback to original upload
                return uploadImage(file);
            }
        }

        // Replace the global uploadImage function with compressed version
        window.uploadImage = uploadCompressedImage;

        // ---------- TOOLBAR COMMANDS ----------
        function execCmd(command, value = null) {
            if (command === 'createLink') {
                const url = prompt('Enter URL:', 'https://');
                if (url) document.execCommand('createLink', false, url);
            } else {
                document.execCommand(command, false, value);
            }
            content.focus();
        }

        // Button event binding
        document.getElementById('boldBtn').addEventListener('click', () => execCmd('bold'));
        document.getElementById('italicBtn').addEventListener('click', () => execCmd('italic'));
        document.getElementById('underlineBtn').addEventListener('click', () => execCmd('underline'));
        document.getElementById('strikeBtn').addEventListener('click', () => execCmd('strikethrough'));
        document.getElementById('ulBtn').addEventListener('click', () => execCmd('insertUnorderedList'));
        document.getElementById('olBtn').addEventListener('click', () => execCmd('insertOrderedList'));
        document.getElementById('h2Btn').addEventListener('click', () => execCmd('formatBlock', 'h2'));
        document.getElementById('h3Btn').addEventListener('click', () => execCmd('formatBlock', 'h3'));
        document.getElementById('h4Btn').addEventListener('click', () => execCmd('formatBlock', 'h4'));
        document.getElementById('alignLeft').addEventListener('click', () => execCmd('justifyLeft'));
        document.getElementById('alignCenter').addEventListener('click', () => execCmd('justifyCenter'));
        document.getElementById('alignRight').addEventListener('click', () => execCmd('justifyRight'));
        document.getElementById('linkBtn').addEventListener('click', () => execCmd('createLink'));
        document.getElementById('unlinkBtn').addEventListener('click', () => execCmd('unlink'));

        // ---------- IMAGE BUTTONS ----------
        function triggerImageUpload(withCaption) {
            pendingCaption = withCaption;
            document.getElementById('imageUploadInput').click();
        }

        document.getElementById('imageOnlyBtn').addEventListener('click', (e) => {
            e.preventDefault();
            triggerImageUpload(false);
        });
        document.getElementById('imageCaptionBtn').addEventListener('click', (e) => {
            e.preventDefault();
            triggerImageUpload(true);
        });

        // ---------- IMAGE UPLOAD HANDLER ----------
        document.getElementById('imageUploadInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert('Image too large. Max 5MB.');
                this.value = '';
                return;
            }
            showNotice('⏳ Uploading & compressing image...', 'info');
            try {
                const url = await uploadCompressedImage(file);
                if (url) {
                    let html = '';
                    if (pendingCaption) {
                        html = `
                            <figure style="margin:16px 0; text-align:center;">
                                <img src="${url}" alt="Image" style="max-width:100%; border-radius:12px;" loading="lazy">
                                <figcaption style="font-size:0.9rem; color:#64748b; margin-top:8px; font-style:italic;">Add caption...</figcaption>
                            </figure>
                        `;
                        pendingCaption = false;
                    } else {
                        html = `<img src="${url}" alt="Image" style="max-width:100%; border-radius:12px; margin:16px 0;" loading="lazy">`;
                    }
                    document.execCommand('insertHTML', false, html);
                    showNotice('✅ Image inserted (compressed)!', 'success');
                    setTimeout(() => hideNotice(), 3000);
                }
            } catch(err) {
                showNotice('❌ Upload failed: ' + err.message, 'error');
            }
            this.value = '';
        });

        // ---------- FORMAT MARKDOWN ----------
        function convertMarkdownToHtml(text) {
            let html = text;
            html = html.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
            html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            html = html.replace(/\*(.*?)\*/g, '<i>$1</i>');
            html = html.replace(/~~(.*?)~~/g, '<s>$1</s>');
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>');
            // Lists
            const lines = html.split('\n');
            let inList = false;
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();
                const isBullet = /^[-*]\s+(.*)/.test(trimmed);
                const isNumbered = /^\d+\.\s+(.*)/.test(trimmed);
                const isList = isBullet || isNumbered;
                if (isList) {
                    if (!inList) {
                        inList = true;
                        if (isBullet) result.push('<ul>');
                        else result.push('<ol>');
                    }
                    let contentText = '';
                    if (isBullet) contentText = trimmed.replace(/^[-*]\s+/, '');
                    else contentText = trimmed.replace(/^\d+\.\s+/, '');
                    result.push(`<li>${contentText}</li>`);
                } else {
                    if (inList) {
                        inList = false;
                        if (result.length > 0 && !result[result.length-1].match(/^<ul>|^<ol>/)) {
                            result.push('</ul>');
                        }
                    }
                    if (trimmed !== '') {
                        if (!/^<[h|u|o|a|p|b|i|s|d|f]/.test(trimmed)) {
                            result.push(`<p>${trimmed}</p>`);
                        } else {
                            result.push(trimmed);
                        }
                    } else {
                        result.push('');
                    }
                }
            }
            if (inList) result.push('</ul>');
            html = result.join('\n');
            html = html.replace(/<p><ul>/g, '<ul>');
            html = html.replace(/<\/ul><\/p>/g, '</ul>');
            html = html.replace(/<p><ol>/g, '<ol>');
            html = html.replace(/<\/ol><\/p>/g, '</ol>');
            html = html.replace(/<p><li>/g, '<li>');
            html = html.replace(/<\/li><\/p>/g, '</li>');
            return html;
        }

        document.getElementById('formatBtn').addEventListener('click', function() {
            const raw = content.innerText || content.textContent || '';
            if (!raw.trim()) {
                showNotice('⚠️ Nothing to format. Paste some content first.', 'info');
                return;
            }
            const formatted = convertMarkdownToHtml(raw);
            content.innerHTML = formatted || '<p>No content to display.</p>';
            showNotice('✅ Content formatted!', 'success');
            setTimeout(() => hideNotice(), 3000);
        });

        // ---------- NOTICE ----------
        function showNotice(msg, type = 'info') {
            notice.className = 'wp-notice ' + type;
            notice.innerHTML = msg;
            notice.style.display = 'block';
        }
        function hideNotice() {
            notice.style.display = 'none';
        }

        // ---------- DATE ----------
        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }
        date.value = getTodayDate();

        // ---------- RESET ----------
        function resetForm() {
            title.value = '';
            content.innerHTML = '<p>Start writing your article...</p>';
            category.value = '';
            tags.value = '';
            excerpt.value = '';
            date.value = getTodayDate();
            featuredInput.value = '';
            featuredPreviewContainer.style.display = 'none';
            featuredPreview.src = '#';
            featuredUrl.value = '';
            currentFeaturedFile = null;
            editingId = null;
            pendingCaption = false;
            publishBtn.style.display = 'block';
            updateBtn.style.display = 'none';
            cancelBtn.style.display = 'none';
            statusBadge.className = 'status-badge draft';
            statusBadge.textContent = 'Draft';
            publishMsg.innerHTML = '';
            showNotice('🆕 New article ready.', 'info');
            setTimeout(hideNotice, 4000);
        }

        // ---------- EDIT ----------
        window.editArticle = async function(id) {
            try {
                const articles = await getArticles();
                const article = articles.find(a => a.id === id);
                if (!article) return alert('Article not found.');
                editingId = id;
                title.value = article.title || '';
                content.innerHTML = article.content || article.summary || '<p>Start writing...</p>';
                category.value = article.category || '';
                tags.value = (article.tags || []).join(', ');
                excerpt.value = article.summary || '';
                date.value = article.date || getTodayDate();
                if (article.image) {
                    featuredUrl.value = article.image;
                    featuredPreview.src = article.image;
                    featuredPreviewContainer.style.display = 'block';
                    currentFeaturedFile = null;
                } else {
                    featuredPreviewContainer.style.display = 'none';
                    featuredUrl.value = '';
                }
                publishBtn.style.display = 'none';
                updateBtn.style.display = 'block';
                cancelBtn.style.display = 'block';
                statusBadge.className = 'status-badge published';
                statusBadge.textContent = 'Published';
                publishMsg.innerHTML = '';
                showNotice(`✏️ Editing: "${article.title}"`, 'info');
                setTimeout(hideNotice, 3000);
                document.querySelector('.wp-editor-wrapper').scrollIntoView({ behavior: 'smooth' });
            } catch(err) {
                alert('Error loading article: ' + err.message);
            }
        };

        cancelBtn.addEventListener('click', resetForm);

        // ---------- PUBLISH ----------
        async function saveArticle(isUpdate = false) {
            const titleVal = title.value.trim();
            const categoryVal = category.value.trim();
            const excerptVal = excerpt.value.trim() || 'No summary provided.';
            const contentVal = content.innerHTML.trim() || excerptVal;
            const tagsVal = tags.value.split(',').map(t => t.trim()).filter(Boolean);
            const dateVal = date.value || getTodayDate();
            let imageUrl = featuredUrl.value;

            if (!titleVal || !categoryVal) {
                showNotice('❌ Please fill in Title and Category.', 'error');
                return;
            }

            publishBtn.disabled = true;
            updateBtn.disabled = true;
            publishMsg.innerHTML = '⏳ Saving...';

            try {
                if (currentFeaturedFile) {
                    const url = await uploadCompressedImage(currentFeaturedFile);
                    if (url) imageUrl = url;
                }
                if (!imageUrl) imageUrl = 'https://picsum.photos/seed/sports/600/400';

                let result;
                if (isUpdate) {
                    result = await updateArticle(editingId, {
                        title: titleVal,
                        content: contentVal,
                        summary: excerptVal,
                        category: categoryVal,
                        author: 'Admin',
                        image: imageUrl,
                        date: dateVal,
                        tags: tagsVal
                    });
                } else {
                    result = await addArticle({
                        title: titleVal,
                        content: contentVal,
                        summary: excerptVal,
                        category: categoryVal,
                        author: 'Admin',
                        image: imageUrl,
                        date: dateVal,
                        tags: tagsVal
                    });
                }

                if (result.success) {
                    showNotice(`✅ Article ${isUpdate ? 'updated' : 'published'} successfully!`, 'success');
                    statusBadge.className = 'status-badge published';
                    statusBadge.textContent = 'Published';
                    if (!isUpdate) resetForm();
                    await refreshArticleList();
                    if (window.loadAndRender) window.loadAndRender();
                    setTimeout(hideNotice, 4000);
                } else {
                    showNotice('❌ Failed: ' + result.error, 'error');
                }
            } catch(err) {
                showNotice('❌ Error: ' + err.message, 'error');
            }

            publishBtn.disabled = false;
            updateBtn.disabled = false;
            publishMsg.innerHTML = '';
        }

        publishBtn.addEventListener('click', () => saveArticle(false));
        updateBtn.addEventListener('click', () => saveArticle(true));

        // ---------- ARTICLE LIST ----------
        async function refreshArticleList() {
            const list = document.getElementById('articleList');
            try {
                const articles = await getArticles();
                if (articles.length === 0) {
                    list.innerHTML = '<span style="color:#94a3b8;">No articles yet.</span>';
                } else {
                    list.innerHTML = articles.map(a => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #f1f5f9;">
                            <span style="cursor:pointer; color:#0b1a2e;" onclick="editArticle('${a.id}')">${a.title}</span>
                            <button onclick="deleteArticle('${a.id}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.8rem;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `).join('');
                }
            } catch(e) {
                list.innerHTML = '<span style="color:#ef4444;">❌ Error loading articles</span>';
            }
        }

        window.deleteArticle = async function(id) {
            if (!confirm('Delete this article permanently?')) return;
            const result = await deleteArticleById(id);
            if (result.success) {
                alert('🗑️ Deleted!');
                if (editingId === id) resetForm();
                await refreshArticleList();
                if (window.loadAndRender) window.loadAndRender();
            } else {
                alert('Delete failed: ' + result.error);
            }
        };

        // ---------- FEATURED IMAGE ----------
        featuredInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert('Image too large. Max 5MB.');
                this.value = '';
                return;
            }
            currentFeaturedFile = file;
            const reader = new FileReader();
            reader.onload = function(ev) {
                featuredPreview.src = ev.target.result;
                featuredPreviewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
            featuredUrl.value = '';
        });

        removeFeaturedBtn.addEventListener('click', function() {
            featuredInput.value = '';
            featuredPreviewContainer.style.display = 'none';
            featuredPreview.src = '#';
            featuredUrl.value = '';
            currentFeaturedFile = null;
        });

        // ---------- LOGOUT ----------
        document.getElementById('dashboardLogout').addEventListener('click', function(e) {
            e.preventDefault();
            adminLogout();
        });

        // ---------- INIT ----------
        async function init() {
            await refreshArticleList();
            resetForm();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
